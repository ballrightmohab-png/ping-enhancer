name: Build Adaptive Aim
on:
  push:
    branches: [arena/c393d2bc-ping-enhancer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: |
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/aim_test.cpp -o build/aim_test
          ./build/aim_test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Select Android NDK
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          fi
          echo "NDK_PATH=$NDK" >> "$GITHUB_ENV"
      - name: Configure Android ARM64
        run: >-
          cmake -S . -B build/android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          -DCMAKE_BUILD_TYPE=Release
      - name: Test standalone hooks, controls and chicken targeting
        run: |
          for test in menu hooks runtime; do
            g++ -std=c++20 -Wall -Wextra -Werror -Itests/stubs \
              -Ibuild/android/_deps/preloader-src/include \
              tests/${test}_test.cpp -ldl -pthread -o build/${test}_test
            ./build/${test}_test
          done
      - name: Build native mod
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/android --target AdaptiveAim --parallel 2 2>&1 | tee build/compiler.log
      - name: Report compiler errors
        if: failure()
        run: |
          python3 - <<'PYREPORT'
          from pathlib import Path
          p = Path('build/compiler.log')
          if p.exists():
              for line in p.read_text().splitlines():
                  if 'error:' in line or 'undefined reference' in line:
                      print('::error::' + line.replace('%', '%25'))
          PYREPORT
      - name: Verify no BedrockTools binary dependency
        run: |
          READELF="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" --dynamic build/android/libAdaptiveAim.so > build/dynamic.txt
          cat build/dynamic.txt
          if grep -i 'NEEDED.*bedrocktools' build/dynamic.txt; then exit 1; fi
          "$READELF" --dyn-syms build/android/libAdaptiveAim.so > build/symbols.txt
          if grep 'UND.*BedrockTools' build/symbols.txt; then exit 1; fi
      - name: Package LeviPack
        run: python3 scripts/package.py build/android/libAdaptiveAim.so build/AdaptiveAim.levipack
      - uses: actions/upload-artifact@v4
        with:
          name: AdaptiveAim-arm64
          path: build/AdaptiveAim.levipack
          if-no-files-found: error
