name: build-levipack

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a .levipack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build, test and package
        run: ./build.sh -c

      - name: Upload the .levipack
        uses: actions/upload-artifact@v4
        with:
          name: levifsr_ai-arm64-v8a
          path: dist/arm64-v8a/levifsr_ai.levipack
          if-no-files-found: error

      - name: Attach the .levipack to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arm64-v8a/levifsr_ai.levipack
